  cuda_profile_speed:   {ru: "Скорость",                    en: "Speed"}
  cuda_profile_hint:
    ru: "Качество (по умолчанию): обычный Faster-Whisper/CTranslate2 без batched inference. Он обычно бережнее к тихим вступлениям, служебным репликам, грязной речи и даёт более подробный таймлайн, что полезно для последующей диаризации. Нагрузка на GPU спокойнее, компьютер легче использовать параллельно. Скорость: включает BatchedInferencePipeline с batch_size=16. Это плотнее загружает CUDA/GPU и резко ускоряет длинные файлы или очередь файлов, но может сильнее зависеть от VAD, склеивать сегменты крупнее и иногда пропускать тихие/пограничные фразы. Используйте для быстрых прогонов, когда GPU можно отдать задаче."
    en: "Quality (default): regular Faster-Whisper/CTranslate2 without batched inference. It is usually safer for quiet intros, production chatter, rough speech, and creates a more detailed timeline, which helps later diarization. GPU load is calmer, so the computer is easier to use in parallel. Speed: enables BatchedInferencePipeline with batch_size=16. This keeps CUDA/GPU much busier and can greatly speed up long files or file queues, but it depends more on VAD, may merge larger segments, and can occasionally miss quiet or boundary phrases. Use it for fast runs when the GPU can be dedicated to the job."
